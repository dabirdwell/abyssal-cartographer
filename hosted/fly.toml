# Abyssal Cartographer: hosted game master. Rename `app` when you run `fly launch`.
app = "abyssal-gm"
primary_region = "dfw"

[build]

[env]
  PORT = "8787"
  MODEL = "claude-haiku-5-5"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
